<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Älykäs Energianäkymä</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #3182ce;
            --bg-badge: #e6fffa;
            --text-badge: #234e52;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .widget-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 380px;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }
        .tabs-container {
            display: flex;
            background: #edf2f7;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            color: #4a5568;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: white;
            color: #2d3748;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .title {
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #a0aec0;
            margin-bottom: 12px;
        }
        .badge {
            display: inline-block;
            background: var(--bg-badge);
            color: var(--text-badge);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .price-display {
            font-size: 42px;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 4px;
        }
        .price-display span {
            font-size: 16px;
            font-weight: 500;
            color: #718096;
        }
        .sub-info {
            font-size: 13px;
            color: #a0aec0;
            margin-bottom: 24px;
        }
        .chart-container {
            position: relative;
            height: 150px;
            margin-bottom: 24px;
        }
        .fixed-container {
            display: none;
            height: 150px;
            margin-bottom: 24px;
            background: #f7fafc;
            border: 2px dashed #e2e8f0;
            border-radius: 16px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #4a5568;
            padding: 16px;
            box-sizing: border-box;
        }
        .fixed-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 6px;
        }
        .fixed-desc {
            font-size: 12px;
            color: #718096;
            line-height: 1.4;
        }
        .appliances-list {
            border-top: 1px solid #edf2f7;
            padding-top: 16px;
            text-align: left;
        }
        .appliance-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: #4a5568;
        }
        .appliance-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .appliance-cost {
            font-weight: 700;
            color: #1a202c;
        }
    </style>
</head>
<body>

    <div class="widget-card">
        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab('porssi')">Pörssisähkö</button>
            <button class="tab-btn" onclick="switchTab('kiinteä')">Kiinteä hinta</button>
        </div>

        <div id="widget-main-title" class="title">Sähkön hinta nyt</div>
        <div id="badge" class="badge">● HALPAA</div>

        <div class="price-display">
            <span id="price-value">0.00</span> <span>snt/kWh</span>
        </div>
        <div id="sub-info" class="sub-info">Sisältää siirron, verot ja ALV:n</div>

        <div id="chart-box" class="chart-container">
            <canvas id="energyChart"></canvas>
        </div>

        <div id="fixed-box" class="fixed-container">
            <div id="fixed-t" class="fixed-title">Sopimushinta voimassa</div>
            <div id="fixed-d" class="fixed-desc">Kulutuksesi lasketaan kiinteän tariffin mukaan. Hintariskitön valinta leasing-sopimukseesi.</div>
        </div>

        <div class="appliances-list">
            <div class="appliance-item">
                <span class="appliance-name">💻 <span id="app-pc">Pelitietokone (1h)</span></span>
                <span class="appliance-cost" id="cost-pc">0.00 €</span>
            </div>
            <div class="appliance-item">
                <span class="appliance-name">🍕 <span id="app-oven">Sähköuuni (1h)</span></span>
                <span class="appliance-cost" id="cost-oven">0.00 €</span>
            </div>
            <div class="appliance-item">
                <span class="appliance-name">🧺 <span id="app-wash">Pesukone (1h)</span></span>
                <span class="appliance-cost" id="cost-wash">0.00 €</span>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const settings = {
            theme: urlParams.get('theme') || 'lumo',
            lang: urlParams.get('lang') || 'fi'
        };

        const translations = {
            fi: {
                porssi: "Pörssisähkö",
                fix: "Kiinteä hinta",
                titlePorssi: "Sähkön hinta nyt",
                titleFix: "Sopimushinta",
                subInfo: "Sisältää siirron, verot ja ALV:n",
                subInfoFix: "Määräaikainen kumppanuushinta",
                halpaa: "● HALPAA",
                kallista: "● KALLISTA",
                fixedTitle: "Sopimushinta voimassa",
                fixedDesc: "Kulutuksesi lasketaan kiinteän tariffin mukaan. Hintariskitön valinta leasing-sopimukseesi.",
                pc: "Pelitietokone (1h)",
                oven: "Sähköuuni (1h)",
                wash: "Pesukone (1h)"
            },
            en: {
                porssi: "Market Price",
                fix: "Fixed Price",
                titlePorssi: "Current Price",
                titleFix: "Contract Price",
                subInfo: "Includes delivery, taxes and VAT",
                subInfoFix: "Fixed rate partnership price",
                halpaa: "● CHEAP",
                kallista: "● EXPENSIVE",
                fixedTitle: "Fixed rate active",
                fixedDesc: "Your consumption is calculated on a secure fixed rate. No market volatility risks.",
                pc: "Gaming PC (1h)",
                oven: "Electric Oven (1h)",
                wash: "Washing Machine (1h)"
            }
        };

        let serverData = null;
        let chartInstance = null;
        let currentTab = 'porssi';
        const FIXED_PRICE_VALUE = 12.50; // Задаем тестовую фиксированную цену (snt/kWh)

        function applyCorporateTheme(theme) {
            const root = document.documentElement;
            if (theme === 'sato') {
                root.style.setProperty('--primary-color', '#ef7d00');
                root.style.setProperty('--bg-badge', '#fff3e0');
                root.style.setProperty('--text-badge', '#e65100');
            } else {
                root.style.setProperty('--primary-color', '#0070f3');
                root.style.setProperty('--bg-badge', '#e6fffa');
                root.style.setProperty('--text-badge', '#234e52');
            }
            
            const activeTabBtn = document.querySelector('.tab-btn.active');
            if (activeTabBtn) {
                activeTabBtn.style.borderBottom = `3px solid var(--primary-color)`;
            }
        }

        async function loadData() {
            try {
                applyCorporateTheme(settings.theme);
                
                const langData = translations[settings.lang] || translations.fi;
                document.querySelectorAll('.tab-btn')[0].innerText = langData.porssi;
                document.querySelectorAll('.tab-btn')[1].innerText = langData.fix;
                
                document.getElementById('app-pc').innerText = langData.pc;
                document.getElementById('app-oven').innerText = langData.oven;
                document.getElementById('app-wash').innerText = langData.wash;
                document.getElementById('fixed-t').innerText = langData.fixedTitle;
                document.getElementById('fixed-d').innerText = langData.fixedDesc;

                const priceRes = await fetch('https://energy-b2b-api.onrender.com/api/v1/current-price');
                const priceData = await priceRes.json();
                
                const chartRes = await fetch('https://energy-b2b-api.onrender.com/api/v1/forecast-prices');
                const chartData = await chartRes.json();
                
                serverData = { current: priceData, forecast: chartData.forecast };
                updateWidget();
            } catch (err) {
                document.getElementById('badge').innerText = "❌";
                document.getElementById('sub-info').innerText = "Connection error to FastAPI.";
            }
        }

        function updateWidget() {
            if (!serverData) return;
            const langData = translations[settings.lang] || translations.fi;

            let activePrice = 0;

            if (currentTab === 'porssi') {
                activePrice = serverData.current.price_total_snt;
                document.getElementById('widget-main-title').innerText = langData.titlePorssi;
                document.getElementById('sub-info').innerText = langData.subInfo;
                document.getElementById('badge').style.display = "inline-block";
                document.getElementById('chart-box').style.display = "block";
                document.getElementById('fixed-box').style.display = "none";

                if (activePrice < 12) {
                    document.getElementById('badge').innerText = langData.halpaa;
                    document.getElementById('badge').style.background = settings.theme === 'sato' ? '#fff3e0' : '#e6fffa';
                } else {
                    document.getElementById('badge').innerText = langData.kallista;
                    document.getElementById('badge').style.background = '#fed7d7';
                }
                buildChart();
            } else {
                // Логика для фиксированной цены
                activePrice = FIXED_PRICE_VALUE;
                document.getElementById('widget-main-title').innerText = langData.titleFix;
                document.getElementById('sub-info').innerText = langData.subInfoFix;
                document.getElementById('badge').style.display = "none";
                document.getElementById('chart-box').style.display = "none";
                document.getElementById('fixed-box').style.display = "flex";
            }

            document.getElementById('price-value').innerText = activePrice.toFixed(2);

            // Пересчет калькулятора
            document.getElementById('cost-pc').innerText = ((0.4 * activePrice) / 100).toFixed(2) + " €";
            document.getElementById('cost-oven').innerText = ((2.0 * activePrice) / 100).toFixed(2) + " €";
            document.getElementById('cost-wash').innerText = ((1.8 * activePrice) / 100).toFixed(2) + " €";
        }

        function switchTab(tab) {
            currentTab = tab;
            const buttons = document.querySelectorAll('.tab-btn');
            if (tab === 'porssi') {
                buttons[0].classList.add('active');
                buttons[1].classList.remove('active');
            } else {
                buttons[0].classList.remove('active');
                buttons[1].classList.add('active');
            }
            updateWidget();
        }

        function buildChart() {
            if (!serverData || currentTab !== 'porssi') return;
            const ctx = document.getElementById('energyChart').getContext('2d');
            
            const labels = serverData.forecast.map(item => {
                return item.raw_date.split('T')[1].substring(0, 5);
            });
            const dataValues = serverData.forecast.map(item => item.price);

            let activeColor = '#0070f3';
            if (settings.theme === 'sato') activeColor = '#ef7d00';

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        borderColor: activeColor,
                        backgroundColor: activeColor + '1A',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 5, font: { size: 10 } } },
                        y: { grid: { color: '#edf2f7' }, ticks: { font: { size: 10 } } }
                    }
                }
            });
        }

        loadData();
    </script>
</body>
</html>
